version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: skyopoly-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:15-alpine
    container_name: skyopoly-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: skyblock
      POSTGRES_PASSWORD: skyblock
      POSTGRES_DB: skyblock
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./Scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skyblock"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis_data:
  postgres_data:

